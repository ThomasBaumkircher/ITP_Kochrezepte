version: '1.0'

services:
  db:
    image: postgres:15.1
    expose:
      - 5432
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  backend:
    build: ./backend
    image: jasonbigcow/oauth2-fastapi
    ports:
      - 8082:8082
    volumes:
      - ./backend/:/usr/backend/
    env_file:
      - ./backend/.env
    command: python3 app/run.py --dev
    depends_on:
      - db

  nginx:
    build: ./
    image: jasonbigcow/oauth2-vue3-nginx
    ports:
      - 8080:8080
    depends_on:
      - backend
    volumes:
      - ./nginx:/etc/nginx/conf.d

volumes:
  postgres_data:


networks:
  default:
    name: fastapi_vue_network
